syntax = "proto3";

package hannah.v1;

import "hannah/v1/shared.proto";
import "hannah/options.proto";

option go_package = "github.com/NurPech/hannah-proto-go/hannahv1;hannahv1";

message DeviceInfo {
  string id       = 1;  // full device prefix, e.g. "javascript.0.virtualDevice.Licht.EG.Wohnzimmer.DeckeSeite"
  string name     = 2;  // display name, e.g. "DeckeSeite"
  string category = 3;  // e.g. "Licht", "Stecker", "Temperaturen"
  repeated string states = 4;       // available state keys: "on", "level", "color", …
  map<string, string> current = 5;  // current values as strings, e.g. {"on": "true", "level": "75"}
  map<string, StateType>  state_types       = 6;  // canon-key -> type, e.g. {"on": BOOLEAN, "level": NUMERIC}
  map<string, EnumValues> state_enum_values = 7;  // canon-key -> allowed values, only present for ENUM/COLOR states
  map<string, bool> state_writable = 8; // canon-key -> writable
}

message RoomInfo {
  string key              = 1;  // room_id (lowercase), e.g. "wohnzimmer"
  string name             = 2;  // display name, e.g. "Wohnzimmer"
  repeated DeviceInfo devices = 3;
}

message GetDevicesResponse {
  repeated RoomInfo rooms = 1;
}

message ControlDeviceRequest {
  option (compat_version) = 2;

  string device_id = 1;  // DeviceInfo.id
  string state     = 2;  // state key: "on", "level", "color"
  string value     = 3;  // string-serialised value: "true", "false", "50", "#FF0000"
  // The calling service and its user, same as SubmitTextRequest: Core looks up
  // the user via linked_accounts to check AgentDevice.required_trust_level.
  // Unset or not linked = guest (trust level 0) (hannah-proto#17).
  string source_service = 4;  // e.g. "telegram"
  string source_user_id = 5;  // e.g. Telegram chat_id as string
}
