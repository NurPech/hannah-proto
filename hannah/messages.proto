syntax = "proto3";

package hannah;

option go_package = "github.com/NurPech/hannah-proto-go;hannahproto";

// --- Messages (passive, per-user mailbox — third notification type
// alongside Notify/Announce, both of which play immediately, see
// hannah-proto#16 / hannah#234) ---
// Not played immediately: the satellite only gives a short chime on
// arrival and shows a dimmed idle LED while unread ones exist. A Message
// is consumed (deleted) only once it has actually been read aloud.
// Access control (requestor_id vs. target user_id) is enforced by Hannah
// Core, not expressed in this schema — same convention as ActivityLogEntry.

message Message {
  int32  id = 1;
  int32  user_id = 2;
  string content = 3;
  string source = 4;
  string created_at = 5;
}

message CreateMessageRequest {
  int32  user_id = 1;
  string content = 2;
  string source = 3;
}

message ListMessagesRequest {
  int32 requestor_id = 1;
  int32 filter_user_id = 2;   // only honored when requestor's trust_level >= 10; 0 = own messages
}

message ListMessagesResponse {
  repeated Message messages = 1;
}

message DeleteMessageRequest {
  int32 requestor_id = 1;
  int32 id = 2;
}
