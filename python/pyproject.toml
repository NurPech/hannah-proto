[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hannah-proto"
version = "0.0.0"
description = "Generated Python gRPC stubs for the Hannah voice assistant proto schema"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Floors must match .gitlab-ci.yml's pinned grpcio-tools version exactly — the
    # generated _pb2.py/_pb2_grpc.py hard-fail at import time if the installed runtime
    # is older than what they were compiled against. Bump this alongside that CI pin,
    # not just when the API surface changes.
    "grpcio>=1.84.0",
    "protobuf>=7.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hannah_proto*"]
